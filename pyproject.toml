# This is the workspace root pyproject.toml.
# Each service (gateway, rag) has its own pyproject.toml with
# its own dependencies. This file ties them together for development.

[project]
name = "local-genai-stack"
version = "0.1.0"
description = "Local GenAI Stack — Privacy-First SLM Gateway + Hybrid Document RAG Pipeline"
readme = "README.md"
authors = [
    { name = "Lakshya Kapoor", email = "kapoorlakshya42@gmail.com" }
]
requires-python = ">=3.10,<3.11"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "openai>=1.0.0",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway", "rag"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["gateway/tests", "rag/tests"]
markers = [
    "slow: marks tests that load heavy ML models (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]


[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = false
check_untyped_defs = false
disable_error_code = [
    "var-annotated",
    "arg-type",
    "assignment",
    "attr-defined",
    "no-redef",
    "dict-item",
    "index",
    "union-attr",
    "misc",
]


[tool.coverage.run]
source = ["gateway/src", "rag/src"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

