# This is the workspace root pyproject.toml.
# Each service (gateway, rag) has its own pyproject.toml with
# its own dependencies. This file ties them together for development.

[project]
name = "local-genai-stack"
version = "0.1.0"
description = "Local GenAI Stack — Privacy-First SLM Gateway + Hybrid Document RAG Pipeline"
readme = "README.md"
authors = [
    { name = "Lakshya Kapoor", email = "kapoorlakshya42@gmail.com" }
]
requires-python = ">=3.10,<3.11"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "openai>=1.0.0",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway", "rag"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["gateway/tests", "rag/tests"]
markers = [
    "slow: marks tests that load heavy ML models (deselect with '-m \"not slow\"')",
]
