[project]
name = "phi3-project"
version = "0.1.0"
description = "SLM Router and OpenAI-Compatible Gateway"
readme = "README.md"
authors = [
    { name = "Lakshya Kapoor", email = "kapoorlakshya42@gmail.com" }
]
requires-python = ">=3.10,<3.11"

dependencies = [
    "accelerate==1.14.0",
    "bitsandbytes==0.50.1",
    "faiss-cpu>=1.15.1",
    "numpy==2.2.6",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "torch==2.13.0",
    "transformers==5.15.1",
]

[project.scripts]
phi3-project = "phi3_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
