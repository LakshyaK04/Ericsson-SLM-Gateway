name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-groups --all-packages

      - name: Download spaCy en_core_web_sm model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run Test Suite (Non-slow)
        run: uv run pytest gateway/tests rag/tests -m "not slow" -v --tb=short

      - name: Run PII Redaction Evaluation
        run: uv run python eval/pii_eval.py

      - name: Run Intent Router Evaluation
        run: uv run python eval/router_eval.py
