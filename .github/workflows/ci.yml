name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies (CPU PyTorch)
        run: |
          uv sync --all-packages --all-groups --no-install-package torch
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Check
        run: uv run mypy gateway/src rag/src

      - name: Verify README static and asset references exist
        run: |
          python -c "import re, sys, os; content = open('README.md', encoding='utf-8').read(); matches = re.findall(r'!?\[.*?\]\(((?:assets|docs|eval/results)/[^)]+)\)', content); missing = [m.split('#')[0] for m in matches if not os.path.exists(m.split('#')[0])]; sys.exit(f'Missing files referenced in README: {missing}' if missing else 0)"

  test:
    name: Unit & Integration Tests (Coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies (CPU PyTorch)
        run: |
          uv sync --all-packages --all-groups --no-install-package torch
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Test Suite with Coverage
        run: uv run pytest gateway/tests rag/tests -m "not slow" -v --tb=short --cov=slm_gateway --cov=rag_service --cov-report=term-missing --cov-report=xml

      - name: Run PII Redaction Evaluation
        run: uv run python eval/pii_eval.py

      - name: Run Intent Router Evaluation
        run: uv run python eval/router_eval.py

  docker-smoke:
    name: Docker Compose Build & Smoke Test (best effort)
    runs-on: ubuntu-latest
    # Non-blocking (continue-on-error: true): Building full multi-stage Docker images for two ML services
    # (including PyTorch, bitsandbytes, Presidio, spaCy, and transformers) on standard 2-vCPU GitHub Actions runners
    # frequently encounters disk capacity limits (~14GB free) and layer download timeouts.
    # The smoke test runs with BACKEND=openai_compatible so model weights are not pulled at runtime,
    # but container build infrastructure failures are kept non-blocking so they do not falsely fail PRs.
    continue-on-error: true
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start services with lightweight mock backend
        env:
          BACKEND: openai_compatible
          BACKEND_URL: http://localhost:8000
          MODEL_ID: mock-slm-model
          PII_FAIL_MODE: closed
        run: docker compose up -d

      - name: Verify service health probes
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            rag_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || true)
            gw_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            echo "Attempt $i: RAG=$rag_code, Gateway=$gw_code"
            if [ "$rag_code" = "200" ] && [ "$gw_code" = "200" ]; then
              echo "Both services are healthy!"
              break
            fi
            sleep 2
          done
          curl -f http://localhost:8001/health
          curl -f http://localhost:8000/health

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
