name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Run Test Suite (Non-slow)
        run: uv run pytest gateway/tests rag/tests -m "not slow" -v --tb=short

      - name: Run PII Redaction Evaluation
        run: uv run python eval/pii_eval.py

      - name: Run Intent Router Evaluation
        run: uv run python eval/router_eval.py
