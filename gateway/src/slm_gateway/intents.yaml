# intents.yaml - Ground truth intent definition and training exemplar bank
# Used by IntentRouter (BAAI/bge-small-en-v1.5) for few-shot semantic similarity routing.
# Each intent contains at least 25 diverse exemplar sentences.

general:
  - "What is the capital of France?"
  - "Tell me a humorous joke to cheer me up."
  - "Who wrote the play Romeo and Juliet?"
  - "Explain the theory of relativity in simple, accessible terms."
  - "What are some healthy, balanced breakfast ideas?"
  - "Who was the first president of the United States?"
  - "Can you compose a short poem about autumn leaves?"
  - "How do plants convert sunlight into chemical energy during photosynthesis?"
  - "Why does the daytime sky appear blue to the human eye?"
  - "What is the approximate distance between the Earth and the Moon?"
  - "Give me three practical tips for learning a foreign language efficiently."
  - "What significant cultural shifts occurred during the European Renaissance?"
  - "How do modern airplanes generate aerodynamic lift to stay in flight?"
  - "Tell me about the ancient origins and modern history of the Olympic Games."
  - "What are the scientifically proven health benefits of drinking green tea?"
  - "Who painted the Mona Lisa and during which century was it created?"
  - "What is the highest mountain peak above sea level on Earth?"
  - "Can you recommend five classic novels from world literature?"
  - "What geological mechanisms cause earthquakes and resultant tsunamis?"
  - "How does the human digestive system process and absorb nutrients?"
  - "Good morning, how are you doing today?"
  - "What is the meteorological distinction between weather and climate?"
  - "Summarize the overarching narrative arc of Homer's Odyssey."
  - "Why do deciduous leaves undergo color transformations in autumn?"
  - "How many recognized continents and major oceans exist on Earth?"
  - "What is the philosophical and etymological meaning of serendipity?"
  - "Who was Marie Curie and what breakthrough discoveries did she make in physics?"
  - "Can you suggest some relaxing and creative weekend hobby activities?"

