[project]
name = "rag-service"
version = "0.1.0"
description = "Document ingestion, chunking, retrieval, and re-ranking RAG service"
readme = "README.md"
authors = [
    { name = "Lakshya Kapoor", email = "kapoorlakshya42@gmail.com" }
]
requires-python = ">=3.10,<3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.28.2",
    "python-docx>=1.1.0",
    "sentence-transformers>=6.1.0",
    "scikit-learn>=1.6.0",
    "numpy==2.2.6",
    "faiss-cpu>=1.15.1",
    "torch==2.13.0",
    "transformers==5.15.1",
    "chromadb>=1.5.9",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that load heavy ML models (deselect with '-m \"not slow\"')",
]
